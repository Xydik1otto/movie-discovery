services:
  db:
    image: pgvector/pgvector:pg16
    container_name: moviediscovery-db
    # Масові завантаження (IMDb ~2.5 млн рядків): більший WAL-бюджет і рідші чекпоінти
    # — інакше на WSL2/Docker COPY інколи падає з "could not write to pg_wal".
    command: ["postgres", "-c", "max_wal_size=4GB", "-c", "checkpoint_timeout=15min", "-c", "checkpoint_completion_target=0.9"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      POSTGRES_DB: ${POSTGRES_DB:-moviediscovery}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movie} -d ${POSTGRES_DB:-moviediscovery}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    container_name: moviediscovery-api
    environment:
      ASPNETCORE_URLS: http://+:5200
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-moviediscovery};Username=${POSTGRES_USER:-movie};Password=${POSTGRES_PASSWORD:-changeme_pg}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      ADMIN_KEY: ${ADMIN_KEY:-changeme_admin}
      # Аніме/манга-каталог: AniList (primary) + офіційний MAL API v2; Jikan — dormant
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
      # YouTube (FR-20): пошук легальних повних викладок
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      JIKAN_URL: ${JIKAN_URL:-https://api.jikan.moe/v4}
    ports:
      - "${API_PORT:-5200}:5200"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: moviediscovery-web
    environment:
      NODE_ENV: production
      # Порожній NEXT_PUBLIC_API_URL → браузер фетчить relative /api/* (same-origin),
      # Next проксіює на бекенд (rewrites) — працює за будь-яким доменом/тунелем.
      NEXT_PUBLIC_API_URL: ""
      API_SERVER_URL: http://api:5200
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: moviediscovery-bot
    environment:
      API_URL: http://api:5200
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped
