services:
  db:
    image: pgvector/pgvector:pg16
    container_name: moviediscovery-db
    # Масові завантаження (IMDb ~2.5 млн рядків): більший WAL-бюджет і рідші чекпоінти
    # — інакше на WSL2/Docker COPY інколи падає з "could not write to pg_wal".
    command: ["postgres", "-c", "max_wal_size=4GB", "-c", "checkpoint_timeout=15min", "-c", "checkpoint_completion_target=0.9"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      POSTGRES_DB: ${POSTGRES_DB:-moviediscovery}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movie} -d ${POSTGRES_DB:-moviediscovery}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    container_name: moviediscovery-api
    environment:
      ASPNETCORE_URLS: http://+:5200
      ASPNETCORE_ENVIRONMENT: Production
      # DataProtection-ключі НАЗОВНІ (owner 09.11: «кукі щоб при кожному
      # перестворенні запоминався логін»): без volume кожен recreate генерує
      # новий keyring → усі md_auth-кукі недійсні → всі логаути.
      ASPNETKEYS_DIRECTORY: /data/keys
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-moviediscovery};Username=${POSTGRES_USER:-movie};Password=${POSTGRES_PASSWORD:-changeme_pg}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      ADMIN_KEY: ${ADMIN_KEY:-changeme_admin}
      # Аніме/манга-каталог: AniList (primary) + офіційний MAL API v2; Jikan — dormant
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
      # YouTube (FR-20): пошук легальних повних викладок
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      JIKAN_URL: ${JIKAN_URL:-https://api.jikan.moe/v4}
      # MD-05/CR-01: спільний ключ бота (той самий у bot). Порожній → bot-header
      # авторизація вимкнена на API (X-Bot-Key запити → 403).
      BOT_API_KEY: ${BOT_API_KEY:-}
    ports:
      - "${API_PORT:-5200}:5200"
    volumes:
      # Персистентний keyring DataProtection: логін переживає recreate контейнерів
      - ./data/keys:/data/keys
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* печеться в бандл ПІД ЧАС БІЛДУ: без args тут Dockerfile-дефолт
      # http://localhost:5200 потрапляє в браузерний JS і за тунелем API «недоступний»
      # (браузер стукає у власний localhost). Порожній → relative /api/* same-origin.
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: moviediscovery-web
    environment:
      NODE_ENV: production
      # Порожній NEXT_PUBLIC_API_URL → браузер фетчить relative /api/* (same-origin),
      # Next проксіює на бекенд (rewrites) — працює за будь-яким доменом/тунелем.
      NEXT_PUBLIC_API_URL: ""
      API_SERVER_URL: http://api:5200
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api
    restart: unless-stopped

  tunnel:
    build:
      context: .
      dockerfile: docker/tunnel.Dockerfile
    container_name: moviediscovery-tunnel
    # Quick-тунель до web. trycloudflare пише URL у stderr, тому 2>&1 обов'язково —
    # tee зберігає повний лог у спільний volume, звідки бот /tunnel витягує свіжий URL.
    # Внутрішній порт web — 3000 (3001 — лише хост-мапінг), тому ціль http://web:3000.
    entrypoint: sh -c "cloudflared tunnel --no-autoupdate --url http://web:3000 2>&1 | tee /state/tunnel.log"
    depends_on:
      - web
    volumes:
      - tunnel-state:/state
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: moviediscovery-bot
    environment:
      API_URL: http://api:5200
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      # MD-05/CR-01: той самий ключ, що й у api. Порожній → бот НЕ надсилає X-Bot-Key,
      # а персональні операції (списки/оцінки) fail-closed: помилка bot_key_not_configured
      # замість мовчазного запису в спільний гостьовий профіль.
      BOT_API_KEY: ${BOT_API_KEY:-}
    depends_on:
      - api
    volumes:
      # docker-сокет — ТІЛЬКИ щоб бот міг зробити `docker restart moviediscovery-tunnel` (/tunnel)
      - //var/run/docker.sock:/var/run/docker.sock
      # лог тунелю зі спільного volume — бот читає звідти URL (read-only)
      - tunnel-state:/state:ro
    restart: unless-stopped

volumes:
  tunnel-state:
